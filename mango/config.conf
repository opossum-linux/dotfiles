# More option see https://github.com/DreamMaoMao/mango/wiki/

# monitor rules
monitorrule=HDMI-A-1,0.55,1,tile,0,1,0,0,1920,1080,165

# Window effect
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 3
blur_params_noise = 0.05
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.5

shadows = 0
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 0-horizontal,1-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=1.0
zoom_end_ratio=1.0
fadein_begin_opacity=1.0
fadeout_begin_opacity=1.0
animation_duration_move=400
animation_duration_open=400
animation_duration_tag=400
animation_duration_close=400
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Master-Stack Layout Setting (tile,spiral,dwindle)
new_is_master=1
default_mfact=0.50
default_nmaster=1
smartgaps=0
default_smfact 1.0

# change master fact for tile,spiral,deck,dwindle
bind=SUPER+ALT,h,resizewin,+50,-0
bind=SUPER+ALT,l,resizewin,+0,-50
# change sub master fact for dwindle,spiral
bind=SUPER+ALT,k,resizewin,-50,+0
bind=SUPER+ALT,j,resizewin,+50,+0

# cursor size
cursor_size=20
env=XCURSOR_SIZE,20

# Misc
xwayland_persistence 1
syncobj_enable 1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
inhibit_regardless_of_visibility=1
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=1
enable_floating_snap=1
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=3
gappiv=3
gappoh=3
gappov=3
scratchpad_width_ratio=0.0
scratchpad_height_ratio=0.0
borderpx=2
rootcolor=0x232136ff
bordercolor=0xea9a97ff
focuscolor=0xea9a97ff
maxmizescreencolor=0xf6c177ff
urgentcolor=0x31748fff
scratchpadcolor=0x516c93ff
globalcolor=0xc4a7e7ff
overlaycolor=0x14a57cff

# layout support:
# horizontal:tile,scroller,grid,monocle,spiral,dwindle
# vertical:vertical_tile,vertical_scroller,vertical_grid,vertical_monocle,vertical_spiral,vertical_dwindle
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:grid
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
# screenshot 
bind=NONE,Print,spawn,bash ~/.config/mango/flameshot.sh
# reload config
bind=SUPER,R,reload_config

# menu and terminal
bind=SUPER,D,spawn,wofi --show drun
bind=SUPER,Return,spawn,kitty
# exit
bind=SUPER,q,killclient,
bind=SUPER,m,quit
# switch window focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,f,togglemaxmizescreen,
bind=SUPER+ALT,f,togglefullscreen,

# tag switch
bind=CTRL,Up,viewtoleft,
bind=CTRL,Down,viewtoright,
bind=CTRL+SUPER,Up,tagtoleft,
bind=CTRL+SUPER,Down,tagtoright,

bind=Ctrl,1,tagsilent,1
bind=Ctrl,2,tagsilent,2
bind=Ctrl,3,tagsilent,3
bind=Ctrl,4,tagsilent,4
bind=Ctrl,5,tagsilent,5
bind=Ctrl,6,tagsilent,6

mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=NONE,btn_left,toggleoverview,-1
mousebind=NONE,btn_right,killclient,0
